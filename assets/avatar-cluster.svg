<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%" role="img" aria-label="Macha, Cubee, and Onee avatar trio">
  <defs>
    <!-- Coral gradient for Cubee -->
    <linearGradient id="svg-cubee-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6A57"/>
      <stop offset="100%" stop-color="#D84330"/>
    </linearGradient>

    <!-- Lavender gradient for Onee -->
    <linearGradient id="svg-onee-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8EEFA"/>
      <stop offset="100%" stop-color="#C2CCE6"/>
    </linearGradient>

    <!-- Cream gradient for Macha -->
    <linearGradient id="svg-macha-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDFB"/>
      <stop offset="100%" stop-color="#EBE3DB"/>
    </linearGradient>

    <filter id="av-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#050906" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Cubee (Left, -12deg) -->
  <g transform="translate(18, 14) rotate(-12, 60, 80)" filter="url(#av-shadow)">
    <!-- Body with 5px ink-900 border -->
    <rect x="0" y="0" width="126" height="116" rx="34" fill="url(#svg-cubee-grad)" stroke="#0A120D" stroke-width="5"/>
    <!-- Glossy highlight -->
    <path d="M 14 12 C 24 6, 102 6, 112 12 C 116 20, 114 30, 110 36 C 88 26, 38 26, 16 36 Z" fill="rgba(255,255,255,0.2)"/>
    <!-- Wide pill eyes -->
    <rect x="25" y="52" width="26" height="12" rx="6" fill="#111316"/>
    <rect x="75" y="52" width="26" height="12" rx="6" fill="#111316"/>
    <circle cx="31" cy="55" r="2.2" fill="#FFFDFB"/>
    <circle cx="81" cy="55" r="2.2" fill="#FFFDFB"/>
  </g>

  <!-- Onee (Right, +12deg) -->
  <g transform="translate(176, 14) rotate(12, 60, 80)" filter="url(#av-shadow)">
    <!-- Body with 5px ink-900 border -->
    <rect x="0" y="0" width="126" height="116" rx="38" fill="url(#svg-onee-grad)" stroke="#0A120D" stroke-width="5"/>
    <!-- Glossy highlight -->
    <path d="M 16 12 C 26 6, 100 6, 110 12 C 114 20, 112 30, 108 36 C 86 26, 40 26, 18 36 Z" fill="rgba(255,255,255,0.3)"/>
    <!-- Tall almond eyes -->
    <ellipse cx="38" cy="58" rx="8.5" ry="15" fill="#111316"/>
    <ellipse cx="88" cy="58" rx="8.5" ry="15" fill="#111316"/>
    <circle cx="36" cy="53" r="2.2" fill="#FFFDFB"/>
    <circle cx="86" cy="53" r="2.2" fill="#FFFDFB"/>
  </g>

  <!-- Macha (Front Center, 0deg) -->
  <g transform="translate(93, 22)" filter="url(#av-shadow)">
    <!-- Body with 5px ink-900 border -->
    <rect x="0" y="0" width="134" height="122" rx="36" fill="url(#svg-macha-grad)" stroke="#0A120D" stroke-width="5"/>
    <!-- Glossy highlight -->
    <path d="M 18 12 C 28 6, 106 6, 116 12 C 120 20, 118 30, 114 36 C 90 26, 42 26, 20 36 Z" fill="rgba(255,255,255,0.45)"/>
    <!-- Macha signature pill eyes -->
    <ellipse cx="44" cy="61" rx="11" ry="13.5" fill="#1A1412"/>
    <ellipse cx="90" cy="61" rx="11" ry="13.5" fill="#1A1412"/>
    <circle cx="41.5" cy="57" r="2.2" fill="#FFFDFB"/>
    <circle cx="87.5" cy="57" r="2.2" fill="#FFFDFB"/>
  </g>
</svg>
